# =============================================================
# Fayna Channel Bridge — ізольоване тестове середовище (Docker)
#
# Стенд (постійний сервер для ручних перевірок):
#   docker compose -f ci/docker-compose.test.yml up -d
#
# Тести (окремий контейнер, БЕЗ постійного сервера):
#   docker compose -f ci/docker-compose.test.yml run --rm tests
#
# ВАЖЛИВО: тести НЕ можна ганяти через `exec` у контейнері `web` —
# там уже слухає порт 8069 постійний сервер, тестовий HTTP-сервер не
# може зайняти порт (OSError: Address already in use), і HttpCase
# починає ходити на ЧУЖИЙ сервер, який не бачить тестової транзакції
# → усі webhook-тести отримують 404. Сервіс `tests` існує саме для
# цього: він піднімає власний HTTP на 8070 і не конфліктує з `web`.
# =============================================================

services:
  # PostgreSQL для тестового Odoo
  db:
    image: postgres:15-alpine
    container_name: fayna_bridge_test_db
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${DB_PASSWORD:-odoo}
      POSTGRES_DB: fayna_bridge_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fayna_bridge_test

  # Odoo 17 + fayna_channel_bridge
  web:
    image: odoo:17.0
    container_name: fayna_bridge_test_web
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      PORT: 5432
      USER: odoo
      PASSWORD: ${DB_PASSWORD:-odoo}
      DB_NAME: fayna_bridge_test
      ODOO_MASTER_PASS: ${ODOO_MASTER_PASS:-admin}
      # Модулі: автономний fayna_channel_bridge (без базового модуля)
      ADDONS: fayna_channel_bridge,mail,web
    ports:
      - "8069:8069"
    volumes:
      # Модуль fayna_channel_bridge (шлях відносно ci/ на рівні репо)
      - ../:/mnt/extra-addons/fayna_channel_bridge
    command: /bin/bash -c "pip3 install -q pytest pytest-cov && odoo --db_host=db --db_port=5432 --db_user=odoo --db_password=${DB_PASSWORD:-odoo} -d fayna_bridge_test --stop-after-init -i fayna_channel_bridge && odoo --db_host=db --db_port=5432 --db_user=odoo --db_password=${DB_PASSWORD:-odoo} -d fayna_bridge_test --workers=1 --max-cron-threads=1"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8069/web/login', timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - fayna_bridge_test

  # Одноразовий контейнер для прогону тестів.
  # Не тримає постійного сервера → тестовий HTTP-сервер сам займає 8070.
  # Запуск: docker compose -f ci/docker-compose.test.yml run --rm tests
  tests:
    image: odoo:17.0
    container_name: fayna_bridge_test_runner
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      PORT: 5432
      USER: odoo
      PASSWORD: ${DB_PASSWORD:-odoo}
      DB_NAME: fayna_bridge_test
    volumes:
      - ../:/mnt/extra-addons/fayna_channel_bridge
    # --http-port=8070: не конфліктує з постійним сервером `web` на 8069.
    # --workers=0: HttpCase потребує однопроцесного режиму (спільний реєстр).
    command: >
      odoo --db_host=db --db_port=5432 --db_user=odoo
      --db_password=${DB_PASSWORD:-odoo}
      -d fayna_bridge_test
      --http-port=8070
      --test-enable --test-tags=/fayna_channel_bridge
      --stop-after-init --log-level=test --workers=0
    networks:
      - fayna_bridge_test

networks:
  fayna_bridge_test:
    driver: bridge
